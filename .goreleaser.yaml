# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: whatsapp-tui

before:
  hooks:
    - go mod tidy
    - go test ./...
    - sh scripts/completions.sh

builds:
  - id: whatsapp-tui
    main: .
    binary: whatsapp-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - completions/*

nfpms:
  - id: packages
    package_name: whatsapp-tui
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Ashank Gupta
    homepage: https://github.com/ashankgupta/whatsapp-tui
    maintainer: Ashank Gupta
    description: A terminal WhatsApp client with chat history, media previews and reactions.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    # Tab completion works out of the box: each shell loads these by itself.
    contents:
      - src: ./completions/whatsapp-tui.bash
        dst: /usr/share/bash-completion/completions/whatsapp-tui
        file_info:
          mode: 0644
      - src: ./completions/whatsapp-tui.zsh
        dst: /usr/share/zsh/site-functions/_whatsapp-tui
        file_info:
          mode: 0644
      - src: ./completions/whatsapp-tui.fish
        dst: /usr/share/fish/vendor_completions.d/whatsapp-tui.fish
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Build & CI
      regexp: '^.*?(build|ci)(\(.+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^style:'
      - '^chore:'

release:
  github:
    owner: ashankgupta
    name: whatsapp-tui
  name_template: "v{{ .Version }}"
  header: |
    {{ .TagBody }}
  footer: |
    ## Installation

    Download the archive for your platform below, extract it, and run `whatsapp-tui`.
    It creates `contacts.json` on first run; add contacts from inside the app.
    Linux users can also install the `.deb`, `.rpm`, `.apk` or Arch package.
    Voice messages need [ffmpeg](https://ffmpeg.org) installed.

    On macOS, clear the Gatekeeper quarantine flag once after extracting:

    ```bash
    xattr -d com.apple.quarantine ./whatsapp-tui
    ```

    Verify downloads against `checksums.txt`:

    ```bash
    sha256sum --ignore-missing -c checksums.txt
    ```
